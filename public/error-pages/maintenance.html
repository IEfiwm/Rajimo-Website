<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>در حال به‌روزرسانی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

:root{
  --bg:#080B12;
  --bg-elevated:#0E131D;
  --grid-line: rgba(255,255,255,0.035);
  --text:#EAF0F7;
  --text-dim:#8792A3;
  --text-faint:#4B5566;
  --border: rgba(255,255,255,0.08);
  --accent: #4C8DFF;
  --accent-soft: rgba(76,141,255,0.12);
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --sans: 'Vazirmatn', sans-serif;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
body{
  background:
    radial-gradient(1100px 600px at 82% -10%, rgba(76,141,255,0.10), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, var(--accent-soft), transparent 55%),
    var(--bg);
  background-attachment: fixed;
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}
.grid-overlay{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: radial-gradient(circle at 50% 40%, black, transparent 75%);
}
.signal-strip{
  position:relative; width:100%; height:64px; overflow:hidden;
  border-bottom:1px solid var(--border);
  background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  z-index:1;
}
.signal-strip .track{
  position:absolute; top:0; left:0; height:100%;
  display:flex;
  animation: scroll-left 9s linear infinite;
}
@keyframes scroll-left{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
.signal-strip svg{ display:block; height:64px; width:auto; flex:none; }
.signal-strip path{
  fill:none; stroke:var(--accent); stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round;
  filter: drop-shadow(0 0 6px var(--accent));
  opacity:0.85;
}
main{
  position:relative; z-index:1; flex:1;
  display:flex; align-items:center; justify-content:center;
  padding: 32px 20px 80px;
}
.card{
  width:100%; max-width:620px;
  background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  border:1px solid var(--border);
  border-radius:20px;
  padding: 44px 40px 36px;
  backdrop-filter: blur(6px);
  position:relative; overflow:hidden;
}
.card::before{
  content: attr(data-code);
  position:absolute; left:-10px; bottom:-38px;
  font-family:var(--mono); font-weight:700; font-size:150px; line-height:1;
  color:rgba(255,255,255,0.025); letter-spacing:-4px; pointer-events:none;
  direction:ltr; z-index:0;
}
.row-top{ position:relative; z-index:1; display:flex; align-items:center; gap:12px; margin-bottom:22px; }
.icon-badge{
  width:44px; height:44px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  background:var(--accent-soft);
  border:1px solid var(--accent);
  flex:none;
}
.icon-badge svg{ width:22px; height:22px; }
.eyebrow{
  font-family:var(--mono); direction:ltr; text-align:left; font-size:12px;
  letter-spacing:0.14em; color:var(--text-dim);
  display:flex; align-items:center; gap:8px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.eyebrow .code{ color:var(--accent); font-weight:600; }
.eyebrow .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex:none; animation:blink 1.8s ease-in-out infinite; }
@keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }
h1{ position:relative; z-index:1; font-family:var(--sans); font-weight:800; font-size:28px; line-height:1.4; margin:0 0 14px; }
p.desc{
  position:relative; z-index:1; font-family:var(--sans); font-weight:400; font-size:15.5px;
  line-height:1.9; color:var(--text-dim); margin:0 0 28px; max-width:50ch;
}
.divider{ height:1px; background:var(--border); margin:24px 0; position:relative; z-index:1; }
.meta-row{
  position:relative; z-index:1; display:flex; flex-wrap:wrap; gap:22px;
  font-family:var(--mono); font-size:12px; color:var(--text-faint); direction:ltr;
}
.meta-row .k{ color:var(--text-faint); }
.meta-row .v{ color:var(--text-dim); }
.actions{ position:relative; z-index:1; display:flex; gap:12px; margin-top:28px; flex-wrap:wrap; }
.btn{
  font-family:var(--sans); font-weight:600; font-size:14px; padding:11px 20px;
  border-radius:10px; border:1px solid var(--border); background:transparent;
  color:var(--text); cursor:pointer; transition: all 0.15s ease;
}
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#08101f; }
.btn:hover{ transform:translateY(-1px); filter:brightness(1.08); }
a.btn{ text-decoration:none; display:inline-block; }
.module{ position:relative; z-index:1; margin-top:8px; }
.captcha-box{
  display:flex; align-items:center; gap:14px;
  border:1px solid var(--border); border-radius:12px; padding:16px 18px;
  background:rgba(255,255,255,0.02);
}
.checkbox{
  width:24px; height:24px; border-radius:6px; border:1.5px solid var(--text-faint);
  flex:none; display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition: all 0.15s ease;
}
.checkbox.checked{ background:var(--accent); border-color:var(--accent); }
.checkbox svg{ width:14px; height:14px; opacity:0; transition:opacity 0.15s ease; stroke:#08101f; }
.checkbox.checked svg{ opacity:1; }
.captcha-box .label{ font-size:14px; color:var(--text); flex:1; }
.captcha-box .brand{ font-family:var(--mono); font-size:10px; color:var(--text-faint); direction:ltr; }
.spinner-wrap{ display:flex; align-items:center; gap:14px; }
.spinner{
  width:22px; height:22px; border-radius:50%;
  border:2.5px solid var(--border); border-top-color:var(--accent);
  animation: spin 0.9s linear infinite; flex:none;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.spinner-label{ font-family:var(--mono); font-size:12.5px; color:var(--text-dim); direction:ltr; }
.countdown{
  font-family:var(--mono); font-size:13px; color:var(--text-dim);
  display:flex; align-items:center; gap:10px; direction:ltr;
}
.countdown .bar{ width:160px; height:5px; border-radius:3px; background:var(--border); overflow:hidden; }
.countdown .bar span{
  display:block; height:100%; width:100%; background:var(--accent);
  animation: drain 12s linear forwards;
}
@keyframes drain{ from{ width:100%; } to{ width:0%; } }
footer{
  position:relative; z-index:1; text-align:center; padding:18px;
  font-family:var(--mono); font-size:11px; color:var(--text-faint);
  direction:ltr; letter-spacing:0.04em;
}
@media (max-width:520px){
  .card{ padding:32px 22px 30px; border-radius:16px; }
  h1{ font-size:23px; }
  .card::before{ font-size:100px; }
}

</style>
</head>

<script>
