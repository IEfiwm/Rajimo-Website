name: Build & Deploy (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build static site and upload via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build static export (HTML / CSS / JS -> out/)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://rajimo.ir' }}

      # Map custom pages into Plesk error_docs/ names + keep /error-pages/ URLs
      - name: Prepare Plesk error documents
        run: |
          set -e
          mkdir -p out/error_docs

          # Next.js generated 404
          cp out/404.html out/error_docs/not_found.html

          # Map branded pages → Plesk default filenames
          cp out/error-pages/firewall.html            out/error_docs/forbidden.html
          cp out/error-pages/link-invalid.html         out/error_docs/unauthorized.html
          cp out/error-pages/origin-502.html           out/error_docs/bad_gateway.html
          cp out/error-pages/origin-502.html           out/error_docs/internal_server_error.html
          cp out/error-pages/origin-502.html           out/error_docs/gateway_timeout.html
          cp out/error-pages/maintenance.html          out/error_docs/service_unavailable.html
          cp out/error-pages/link-expired.html         out/error_docs/gone.html

          # Also keep copies under Plesk error_docs by semantic name (for panel overrides)
          cp out/error-pages/*.html out/error_docs/

          test -f out/.htaccess && echo "htaccess ok" || echo "WARNING: .htaccess missing"
          test -f out/web.config && echo "web.config ok" || echo "WARNING: web.config missing"
          ls -la out/error_docs | head -40

      - name: Deploy to host over FTP (parallel)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          FTP_PARALLEL: ${{ vars.FTP_PARALLEL || '16' }}
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          REMOTE_DIR="${FTP_SERVER_DIR:-/}"
          case "$REMOTE_DIR" in
            */) ;;
            *) REMOTE_DIR="${REMOTE_DIR}/" ;;
          esac

          PARALLEL="${FTP_PARALLEL:-8}"

          if [ "$FTP_PROTOCOL" = "ftps" ]; then
            SSL_OPTS='set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no;'
          else
            SSL_OPTS='set ftp:ssl-allow no;'
          fi

          echo "Deploying ./out → ${FTP_SERVER}:${REMOTE_DIR} (parallel=${PARALLEL}, protocol=${FTP_PROTOCOL})"

          # shellcheck disable=SC2086
          lftp -c "
            ${SSL_OPTS}
            set net:max-retries 5;
            set net:timeout 30;
            set net:connection-limit ${PARALLEL};
            set mirror:parallel-transfer-count ${PARALLEL};
            set mirror:parallel-directories true;
            set cmd:fail-exit true;
            open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" ${FTP_SERVER};
            lcd ./out;
            cd ${REMOTE_DIR};
            mirror --reverse \
              --parallel=${PARALLEL} \
              --delete \
              --verbose \
              --no-perms \
              --exclude-glob .git* \
              --exclude-glob .ftp-deploy-sync-state.json;
            bye
          "

          echo "FTP deploy finished."
